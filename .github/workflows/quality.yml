# SPDX-License-Identifier: MIT
name: Portable core quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang clang-tidy cppcheck libgtest-dev libgmock-dev
          npm install --global @mermaid-js/mermaid-cli@11.16.0
      - name: Validate the portable cores
        run: python3 scripts/validate.py --work build-validation --jobs 16 --graphs
      - name: Keep gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: |
            build-validation/*.log
            build-validation/*.rc
            build-validation/gates.json
            build-validation/mutations/results.json
            build-validation/graphs/*.svg
  bare-metal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install RV32 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc
      - name: Validate the freestanding cores
        run: python3 scripts/baremetal.py --work build-rv32 --jobs 16
      - name: Keep RV32 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rv32-evidence
          path: |
            build-rv32/results.json
            build-rv32/*/*.log
            build-rv32/*/*.map
